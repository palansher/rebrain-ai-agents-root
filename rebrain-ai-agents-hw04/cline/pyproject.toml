[project]
name = "news-monitor"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "faststream[redis]>=0.7.8",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.3",
    "spacy>=3.8.18",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
